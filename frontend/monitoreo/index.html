<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Monitoreo IoT
</title>

<link
rel="icon"
href="assets/favicon.ico">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link
href="css/style.css"
rel="stylesheet">

</head>

<body>

<div class="container container-monitor">

    <!-- ================================= -->
    <!-- HEADER -->
    <!-- ================================= -->

    <div class="glass-card text-center">

        <h1>
            Dashboard Monitoreo IoT
        </h1>

        <div class="estado">

            ESP:
            <span id="estadoESP">
                ONLINE
            </span>

        </div>

        <div class="estado">

            Movimiento:
            <span id="movimientoActual">
                stop
            </span>

        </div>

    </div>

    <!-- ================================= -->
    <!-- CONTENIDO -->
    <!-- ================================= -->

    <div class="row">

        <!-- ============================== -->
        <!-- RADAR -->
        <!-- ============================== -->

        <div class="col-md-4">

            <div class="glass-card">

                <h4>
                    Radar Obstáculos
                </h4>

                <canvas id="radarChart">

                </canvas>

            </div>

        </div>

        <!-- ============================== -->
        <!-- TELEMETRIA -->
        <!-- ============================== -->

        <div class="col-md-4">

            <div class="glass-card">

                <h4>
                    Telemetría
                </h4>

                <ul
                id="telemetriaLista"
                class="
                list-group
                lista-scroll
                ">

                </ul>

            </div>

            <div class="glass-card">

                <h4>
                    Últimos Movimientos
                </h4>

                <ul
                id="historialMovimientos"
                class="
                list-group
                lista-scroll
                ">

                </ul>

            </div>

        </div>

        <!-- ============================== -->
        <!-- DEMOS -->
        <!-- ============================== -->

        <div class="col-md-4">

            <div class="glass-card">

                <h4>
                    Demos y Movimientos
                </h4>

                <div
                id="listaDemos">

                </div>

            </div>

        </div>

    </div>

    <!-- ================================= -->
    <!-- FOOTER -->
    <!-- ================================= -->

    <footer class="footer text-center">

        <p>
            Sistema IoT para Control y
            Monitoreo de Carrito Inteligente
        </p>

        <p>
            Elaborado por:
            Karen Garcia Angeles
        </p>

        <p>
            Tecnológico Nacional de México - Campus Pachuca
        </p>

    </footer>

</div>

<script src="js/monitor.js"></script>

</body>
</html>
