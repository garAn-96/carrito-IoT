<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Control IoT
</title>

<link
rel="icon"
href="assets/favicon.png"
type="image/png">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
rel="stylesheet">

<link
href="css/style.css"
rel="stylesheet">

</head>

<body>

<div class="container container-control">

    <!-- ============================== -->
    <!-- HEADER -->
    <!-- ============================== -->

    <div class="glass-card text-center">

        <h1>
            Control Vehículo IoT
        </h1>

        <div class="estado-box">

            WS:

            <span id="estadoWS">

                DESCONECTADO

            </span>

        </div>

        <div class="mt-2">

            Movimiento:

            <span id="movimientoActual">

                stop

            </span>

        </div>

    </div>

    <!-- ============================== -->
    <!-- CONTENIDO -->
    <!-- ============================== -->

    <div class="row">

        <!-- ========================== -->
        <!-- IZQUIERDA -->
        <!-- ========================== -->

        <div class="col-md-3">

            <!-- VELOCIDAD -->

            <div class="glass-card">

                <h4>
                    Velocidad
                </h4>

                <input
                type="range"

                id="sliderVelocidad"

                min="100"
                max="700"
                value="450">

                <div class="mt-2">

                    Valor:

                    <span
                    id="valorVelocidad">

                        700

                    </span>

                </div>

            </div>

            <!-- ALERTA -->

            <div
            id="alertaObstaculo"
            class="
            alert-obstaculo
            mb-3
            ">

            </div>

            <!-- EVENTOS -->

            <div class="glass-card">

                <h4>
                    Eventos
                </h4>

                <ul
                id="listaEventos"
                class="
                list-group
                lista-scroll
                ">

                </ul>

            </div>

        </div>

        <!-- ========================== -->
        <!-- CENTRO -->
        <!-- ========================== -->

        <div class="col-md-6">

            <div class="glass-card text-center">

                <!-- FILA 1 -->

                <div class="
                row
                mb-2
                justify-content-center
                ">

                    <div class="col-3">

                        <button
                        class="btn-control"

                        onclick="
                        mover(
                        'vuelta_adelante_izquierda'
                        )">

                            <i class="
                            bi bi-arrow-up-left
                            "></i>

                        </button>

                    </div>

                    <div class="col-3">

                        <button
                        class="btn-control"

                        onclick="
                        mover(
                        'adelante'
                        )">

                            <i class="
                            bi bi-arrow-up
                            "></i>

                        </button>

                    </div>

                    <div class="col-3">

                        <button
                        class="btn-control"

                        onclick="
                        mover(
                        'vuelta_adelante_derecha'
                        )">

                            <i class="
                            bi bi-arrow-up-right
                            "></i>

                        </button>

                    </div>

                </div>

                <!-- FILA 2 -->

                <div class="
                row
                mb-2
                justify-content-center
                ">

                    <div class="col-3">

                        <button
                        class="btn-control"

                        onclick="
                        mover(
                        'izquierda'
                        )">

                            <i class="
                            bi bi-arrow-left
                            "></i>

                        </button>

                    </div>

                    <div class="col-3">

                        <button
                        class="
                        btn-control
                        btn-stop
                        "

                        onclick="
                        mover(
                        'stop'
                        )">

                            <i class="
                            bi bi-stop-fill
                            "></i>

                        </button>

                    </div>

                    <div class="col-3">

                        <button
                        class="btn-control"

                        onclick="
                        mover(
                        'derecha'
                        )">

                            <i class="
                            bi bi-arrow-right
                            "></i>

                        </button>

                    </div>

                </div>

                <!-- FILA 3 -->

                <div class="
                row
                mb-2
                justify-content-center
                ">

                    <div class="col-3">

                        <button
                        class="btn-control"

                        onclick="
                        mover(
                        'vuelta_atras_izquierda'
                        )">

                            <i class="
                            bi bi-arrow-down-left
                            "></i>

                        </button>

                    </div>

                    <div class="col-3">

                        <button
                        class="btn-control"

                        onclick="
                        mover(
                        'atras'
                        )">

                            <i class="
                            bi bi-arrow-down
                            "></i>

                        </button>

                    </div>

                    <div class="col-3">

                        <button
                        class="btn-control"

                        onclick="
                        mover(
                        'vuelta_atras_derecha'
                        )">

                            <i class="
                            bi bi-arrow-down-right
                            "></i>

                        </button>

                    </div>

                </div>

                <!-- FILA 4 -->

                <div class="
                row
                justify-content-center
                ">

                    <div class="col-3">

                        <button
                        class="btn-control"

                        onclick="
                        mover(
                        'giro_360_izquierda'
                        )">

                            <i class="
                            bi bi-arrow-counterclockwise
                            "></i>

                        </button>

                    </div>

                    <div class="col-3">

                        <button
                        class="btn-control"

                        onclick="
                        mover(
                        'giro_90_izquierda'
                        )">

                            90°

                        </button>

                    </div>

                    <div class="col-3">

                        <button
                        class="btn-control"

                        onclick="
                        mover(
                        'giro_90_derecha'
                        )">

                            90°

                        </button>

                    </div>

                    <div class="col-3">

                        <button
                        class="btn-control"

                        onclick="
                        mover(
                        'giro_360_derecha'
                        )">

                            <i class="
                            bi bi-arrow-clockwise
                            "></i>

                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- ========================== -->
        <!-- DERECHA -->
        <!-- ========================== -->

        <div class="col-md-3">

            <div class="glass-card">

                <h4>
                    Demos
                </h4>

                <div
                id="listaDemos">

                </div>

            </div>

        </div>

    </div>

    <!-- FOOTER -->

    <footer class="footer text-center">

        Sistema IoT Inteligente |
        Karen Garcia |
        TecNM

    </footer>

</div>

<script src="js/control.js"></script>

</body>
</html>
