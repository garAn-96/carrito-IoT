<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Control IoT
</title>

<link
rel="icon"
href="assets/favicon.ico">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
rel="stylesheet">

<link
href="css/style.css"
rel="stylesheet">

</head>

<body>

<div class="container container-control">

    <!-- ============================== -->
    <!-- TITULO -->
    <!-- ============================== -->

    <div class="glass-card text-center">

        <h1>
            Centro de Control IoT
        </h1>

        <div class="estado-box">

            WebSocket:
            <span id="estadoWS">
                CONECTADO
            </span>

        </div>

        <div class="estado-box">

            Movimiento:
            <span id="movimientoActual">
                stop
            </span>

        </div>

    </div>

    <!-- ============================== -->
    <!-- ALERTA -->
    <!-- ============================== -->

    <div
    id="alertaObstaculo"
    class="alert-obstaculo text-center">

        <i class="bi bi-exclamation-triangle-fill"></i>

        OBSTÁCULO DETECTADO

    </div>

    <!-- ============================== -->
   
<div class="row">

    <!-- ================================= -->
    <!-- VELOCIDAD -->
    <!-- ================================= -->

    <div class="col-md-3">

        <div class="glass-card h-100">

            <h4>
                Velocidad
            </h4>

            <input
            type="range"
            min="0"
            max="1023"
            value="700"
            id="sliderVelocidad">

            <div class="mt-3">

                Valor:

                <span id="valorVelocidad">
                    700
                </span>

            </div>

        </div>

    </div>

    <!-- ================================= -->
    <!-- CONTROLES -->
    <!-- ================================= -->

    <div class="col-md-6">

        <div class="glass-card text-center">

            <h4>
                Control Movimiento
            </h4>

            <div
            id="alertaObstaculo"
            class="alert-obstaculo mb-3">

                <i class="
                bi bi-exclamation-triangle-fill
                "></i>

                Obstáculo Detectado

            </div>

            <!-- FILA 1 -->

            <div class="row mb-2 justify-content-center">

                <div class="col-3">

                    <button
                    class="btn-control"
                    onclick="mover('giro_90_izquierda')">

                        <i class="
                        bi bi-arrow-counterclockwise
                        "></i>

                    </button>

                </div>

                <div class="col-3">

                    <button
                    class="btn-control"
                    onclick="mover('adelante')">

                        <i class="
                        bi bi-arrow-up
                        "></i>

                    </button>

                </div>

                <div class="col-3">

                    <button
                    class="btn-control"
                    onclick="mover('giro_90_derecha')">

                        <i class="
                        bi bi-arrow-clockwise
                        "></i>

                    </button>

                </div>

            </div>

            <!-- FILA 2 -->

            <div class="row mb-2 justify-content-center">

                <div class="col-3">

                    <button
                    class="btn-control"
                    onclick="mover('izquierda')">

                        <i class="
                        bi bi-arrow-left
                        "></i>

                    </button>

                </div>

                <div class="col-3">

                    <button
                    class="btn-control btn-stop"
                    onclick="mover('stop')">

                        <i class="
                        bi bi-stop-fill
                        "></i>

                    </button>

                </div>

                <div class="col-3">

                    <button
                    class="btn-control"
                    onclick="mover('derecha')">

                        <i class="
                        bi bi-arrow-right
                        "></i>

                    </button>

                </div>

            </div>

            <!-- FILA 3 -->

            <div class="row mb-2 justify-content-center">

                <div class="col-3">

                    <button
                    class="btn-control"
                    onclick="
                    mover(
                    'vuelta_atras_izquierda'
                    )">

                        <i class="
                        bi bi-arrow-down-left
                        "></i>

                    </button>

                </div>

                <div class="col-3">

                    <button
                    class="btn-control"
                    onclick="mover('atras')">

                        <i class="
                        bi bi-arrow-down
                        "></i>

                    </button>

                </div>

                <div class="col-3">

                    <button
                    class="btn-control"
                    onclick="
                    mover(
                    'vuelta_atras_derecha'
                    )">

                        <i class="
                        bi bi-arrow-down-right
                        "></i>

                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- ================================= -->
    <!-- DEMOS -->
    <!-- ================================= -->

    <div class="col-md-3">

        <div class="glass-card h-100">

            <h4>
                Demos
            </h4>

            <div id="listaDemos">

            </div>

        </div>

    </div>

</div>

    <!-- ============================== -->
    <!-- FOOTER -->
    <!-- ============================== -->

    <footer class="footer text-center">

        <p>
            Sistema IoT para Control y
            Monitoreo de Carrito Inteligente
        </p>

        <p>
            Elaborado por:
            Karen Garcia Angeles
        </p>

        <p>
            Tecnológico Nacional de México - Campus Pachuca
        </p>

    </footer>

</div>

<script src="js/control.js"></script>

</body>
</html>
